[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evilazp"
version = "0.4.0"
description = "Interactive Azure DevOps Pipeline command shell for authorized self-hosted agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["certifi>=2024.8.30", "azure-storage-file-share>=12.19.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
evilazp = "azure_pipeline_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
